<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				if (window.name !== 'meemare-studio-plan') return;
				var prefix = 'meemare-studio-plan:';
				var store = window.localStorage;
				var get = store.getItem.bind(store);
				var set = store.setItem.bind(store);
				var rem = store.removeItem.bind(store);
				store.getItem = function (key) { return get(prefix + key); };
				store.setItem = function (key, value) { return set(prefix + key, value); };
				store.removeItem = function (key) { return rem(prefix + key); };
				var open = indexedDB.open.bind(indexedDB);
				indexedDB.open = function (name, version) {
					if (name === 'openplan3d-local') name = 'meemare-studio-plan';
					return arguments.length > 1 ? open(name, version) : open(name);
				};
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<title>open3dFloorplan</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
